# Integrated dance-CV pipeline config. The default mirrors the project diagram:
# YOLOv8 crop proposals -> parallel pose/embedding streams -> temporal scoring
# -> fusion. Flip enabled flags as checkpoints become available.

preprocessing:
  # Final/demo runs use detector-based person cropping. Do not use the local
  # motion-crop debug config for submitted results; it can produce lower-quality
  # crops on custom portrait videos.
  crop_mode: detector_union
  detector_backend: yolov8      # "yolov8" or "torchvision"
  detector_model: yolov8n.pt
  detector_sample_stride: 10
  detector_max_samples: 80
  detector_score_threshold: 0.7
  detector_pad_ratio: 0.35
  detector_min_detection_rate: 0.6
  detector_min_edge_margin: 0.03
  detector_max_edge_contact_rate: 0.0

models:
  hrnet:
    enabled: true
    config:     configs/model/hrnet_w32.yaml
    checkpoint: data/processed/train_hrnet_w32/best.pt
  simple_baseline:
    enabled: true
    config:     configs/model/simple_baseline.yaml
    checkpoint: data/processed/simple_baseline/best.pt
  gnn:
    enabled: true
    upstream: hrnet
    checkpoint: checkpoints/pose_gnn_encoder_oscar.pt

# When the Mia LSTM checkpoint is present, keypoint streams use LSTM
# probabilities for per-part "off" detection. If the checkpoint is absent, the
# runner falls back to the geometric threshold head unless --require-lstm is set.
lstm:
  enabled: true
  checkpoint: checkpoints/lstm/best_model.pt

error_detection:
  threshold: 0.25       # torso-length error above which threshold head flags a frame
  min_duration_s: 0.5

fusion:
  similarity_weight: 0.4
  off_threshold: 0.5

scoring:
  body_part_weights:
    LEFT_ARM:  1.3
    RIGHT_ARM: 1.3
    LEFT_LEG:  0.7
    RIGHT_LEG: 0.7
    TORSO:     1.1
    HEAD:      0.8
