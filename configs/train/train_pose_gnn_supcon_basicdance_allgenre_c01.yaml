decisions_ref: docs/project_decisions.md

# All-genre Basic Dance SupCon training for the old PoseGNN embedding branch.
# Data filter: situation=sBM, camera=c01, PKL root=data/keypoints2d, genres=all.
# This does not change the integrated pipeline default GNN checkpoint.

pkl_root: data/keypoints2d
index_csv: data/processed/basic_dance_embedding_index_allgenre_c01.csv
output_dir: data/processed/train_pose_gnn_supcon_basicdance_allgenre_c01

situation: sBM
use_cameras: ["c01"]
genres: all
rebuild_index: false

split_mode: dance_label
val_ratio: 0.2
val_cameras: null
seed: 42

window_size: 32
window_stride: 8
min_confidence: 0.2

in_features: 3
embedding_dim: 128
frame_embedding_dim: 128
dropout: 0.1
pooling: mean

temperature: 0.07

n_labels_per_batch: 16
n_samples_per_label: 4
batches_per_epoch: null
# Training rows whose dance_label appears fewer than this many times are
# filtered before balanced sampling, so every SupCon anchor has positives.
min_train_rows_per_label: 2

epochs: 60
learning_rate: 3.0e-4
weight_decay: 1.0e-4
grad_clip: 1.0

device: auto
num_workers: 4
save_every: 5
eval_every: 1
log_every: 10
pair_eval_max_pairs_per_type: 50000

deploy_checkpoint: checkpoints/pose_gnn_encoder_basicdance_allgenre_c01_supcon.pt
