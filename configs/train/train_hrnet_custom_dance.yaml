decisions_ref: docs/project_decisions.md

# Use this only after human-labeled custom_dance JSONL files exist.
# The model is still HRNet-W32 from random initialization; custom_dance labels
# must come from manual annotation, not detector or pose pseudo-labels.

stage: hrnet_aist_custom_dance
data_config: configs/data/pose_train.yaml
model_config: configs/model/hrnet_w32.yaml
output_dir: data/processed/train_hrnet_w32_custom_dance

dataset_mix:
  aistpp: 0.75
  custom_dance: 0.25

epochs: 50
batch_size: 16
num_workers: 6
optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
scheduler:
  name: cosine
  warmup_epochs: 5
  min_lr: 1.0e-6

loss:
  name: joint_mse_with_visibility
  use_target_weight: true

eval_every_n_epochs: 2
save_every_n_epochs: 5
log_every_n_steps: 50

resume_from: null
init_from: null
